name: Build example

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Explicit TeX Live package set instead of texlive-full, derived
      # from what examples/demo.tex, examples/tikz-demo.tex and
      # examples/tikz-standalone.tex actually pull in (checked against
      # their .log files and each package's TeX Live "collection" via
      # `tlmgr info`):
      #   texlive-latex-base         core LaTeX (hyperref, geometry,
      #                              kvoptions, etoolbox, amsmath, ...)
      #   texlive-latex-recommended  beamer itself, translator, xcolor,
      #                              fontspec, xkeyval
      #   texlive-latex-extra        everyhook (beamer's font-size
      #                              hooks); also `standalone' and
      #                              `preview', which
      #                              tikz-standalone.tex's
      #                              `\documentclass[tikz]{standalone}'
      #                              needs (no Beamer/Kyoto theme file
      #                              involved -- see that file's own
      #                              comment)
      #   texlive-pictures           pgf (beamer's own dependency)
      #   texlive-luatex             luaotfload (LuaLaTeX font loading)
      #   texlive-lang-japanese      luatexja / luatexja-fontspec
      #   texlive-fonts-recommended  Latin Modern (this theme's monospace
      #                              font, not just a fallback)
      #   texlive-fonts-extra        Noto Sans / Roboto Condensed (plain
      #                              font files bundled by TeX Live)
      # Noto's CJK fonts are a separate apt package: TeX Live does not
      # bundle them itself, so without `fonts-noto-cjk`, \setmainjfont
      # would fall back to a font that only exists on the maintainer's
      # own machine, and the demo's Japanese text would fail to render
      # on this runner.
      - name: Install TeX Live and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-pictures \
            texlive-luatex \
            texlive-lang-japanese \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            latexmk \
            fonts-noto-cjk

      # `fontawesome6' -- used only by the "Formal modeling is
      # essential" showcase frame in tikz-demo.tex -- is not packaged
      # for Ubuntu's TeX Live at all (confirmed via
      # https://packages.ubuntu.com/search?searchon=contents&keywords=fontawesome6.sty),
      # and `tlmgr` refuses to manage a Debian/Ubuntu apt-installed TeX
      # Live tree, so neither `apt-get` nor `tlmgr install` can provide
      # it here. Fetch just the LuaLaTeX-relevant files (matches what
      # examples/tikz-demo.log shows actually getting loaded locally)
      # straight from CTAN into `TEXMFHOME` instead: unlike TeX Live's
      # own system trees, `TEXMFHOME` is scanned live by kpathsea, so no
      # `texhash`/`mktexlsr` step is needed after adding files to it.
      # Pinned to a single well-maintained mirror (mirrors.mit.edu)
      # rather than the `mirrors.ctan.org`/`ctan.org` auto-redirect
      # service: that service 307s to a geo-selected volunteer mirror
      # that varies run to run, and one such pick failed here with a
      # broken TLS certificate chain.
      - name: Install fontawesome6 (not packaged for Ubuntu's TeX Live)
        run: |
          texmfhome="$(kpsewhich -var-value TEXMFHOME)"
          mkdir -p "$texmfhome/tex" "$texmfhome/fonts/opentype"
          base=https://mirrors.mit.edu/CTAN/fonts/fontawesome6
          for f in fontawesome6.sty fontawesome6-utex-helper.sty \
                   fontawesome6-mapping.def fontawesome6.lua \
                   tufontawesome6free.fd tufontawesome6brands.fd; do
            curl -sSfL -o "$texmfhome/tex/$f" "$base/tex/$f"
          done
          for f in FontAwesome6Free-Solid-900.otf \
                   FontAwesome6Brands-Regular-400.otf; do
            curl -sSfL -o "$texmfhome/fonts/opentype/$f" "$base/opentype/$f"
          done

      - name: Build examples
        run: make

      - name: Upload demo.pdf
        uses: actions/upload-artifact@v4
        with:
          name: demo-pdf
          path: examples/demo.pdf

      - name: Upload tikz-demo.pdf
        uses: actions/upload-artifact@v4
        with:
          name: tikz-demo-pdf
          path: examples/tikz-demo.pdf

      - name: Upload tikz-standalone.pdf
        uses: actions/upload-artifact@v4
        with:
          name: tikz-standalone-pdf
          path: examples/tikz-standalone.pdf
